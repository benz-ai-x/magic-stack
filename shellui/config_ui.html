<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magic Stack · 设置</title>
<style>
:root{--bg:#fff;--surface:#f7f8fa;--fg:#111;--muted:#6b7280;--border:#d9dee7;--accent:#0f66e0;
--ok:#2c7c4d;--danger:#d62516;--warn:#966305;--font-display:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
--font-mono:"SFMono-Regular",Consolas,Menlo,monospace;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--surface:#2c2c2e;--fg:#f5f5f7;--muted:#aeaeb2;--border:#3a3a3c;--accent:#4098ff;--ok:#30d158;--danger:#ff5c50;--warn:#ffd60a;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
/* 可见滑动条（评审要求）：常驻显示、窄轨不占内容 */
::-webkit-scrollbar{-webkit-appearance:none;width:9px;height:9px}
::-webkit-scrollbar-thumb{background:color-mix(in oklch,var(--muted),transparent 55%);border-radius:999px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:color-mix(in oklch,var(--muted),transparent 30%);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
html,body{height:100%}
body{overflow:hidden;background:var(--surface);color:var(--fg);
font-family:var(--font-display);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;outline:none}
.mono{font-family:var(--font-mono)}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in oklch,var(--accent),var(--bg) 30%);outline-offset:2px}
.app-shell{width:100%;height:100%;min-width:880px;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:minmax(0,1fr);border:1px solid var(--border);background:var(--bg)}
/* sidebar */
.sidebar{display:flex;flex-direction:column;padding:20px 14px 14px;background:var(--surface);border-right:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;border-bottom:1px solid var(--border)}
.brand-mark{width:30px;height:24px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:5px 4px;border:1px solid var(--fg);border-radius:4px}
.brand-mark i{width:5px;height:5px;justify-self:center;border-radius:50%;background:var(--fg)}
.brand-name{font-size:16px;font-weight:600;line-height:1.35;white-space:nowrap}
.brand-subtitle{color:var(--muted);font-size:12px}
.nav-group{margin-top:10px}
.nav-group:first-of-type{margin-top:12px}
.nav-label{padding:0 10px 4px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.side-nav{display:grid;gap:3px}
.nav-item{width:100%;min-height:34px;display:flex;align-items:center;gap:10px;padding:5px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);cursor:pointer;text-align:left;font-weight:550;font-size:15px}
.nav-item svg{width:16px;height:16px;flex:0 0 auto;align-self:flex-start;margin-top:2px}
.nav-text{display:flex;flex-direction:column;min-width:0}
.nav-sub{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:color-mix(in oklch,var(--surface),var(--border) 28%);color:var(--fg)}
.nav-item[aria-current=page]{background:var(--bg);color:var(--fg);border-color:var(--border);box-shadow:0 1px 2px color-mix(in oklch,var(--fg),transparent 94%)}
#nav-container{flex:1 1 auto;min-height:0;overflow-y:auto}
.priority-note{margin:10px 4px 0;padding:9px 10px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;line-height:1.5}
.priority-note strong{display:inline;color:var(--fg);font-weight:550}
.sidebar-ai-helper{margin:8px 4px 0}
.sidebar-ai-helper .btn svg{width:16px;height:16px;flex:0 0 auto}
/* workbench */
.workbench{display:grid;grid-template-areas:"header" "pending" "content" "status";grid-template-rows:72px auto minmax(0,1fr) 32px;background:var(--bg);min-width:0;min-height:0}
.app-header{grid-area:header;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 28px;border-bottom:1px solid var(--border)}
.page-heading h1{font-size:23px;font-weight:600;line-height:1.35}
.page-heading p{color:var(--muted);font-size:13px}
.header-actions{display:flex;gap:8px;align-items:center}
.pending-bar{grid-area:pending;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:9px 28px;border-bottom:1px solid color-mix(in oklch,var(--accent),var(--border) 52%);background:color-mix(in oklch,var(--accent),var(--bg) 94%)}
.pending-copy{display:flex;align-items:center;gap:12px;min-width:0}
.pending-copy strong{font-size:13px;white-space:nowrap}
.pending-items{display:flex;align-items:center;gap:6px;min-width:0;overflow-x:auto;padding:2px}
.pending-item{min-height:30px;padding:0 9px;border:1px solid color-mix(in oklch,var(--accent),var(--border) 65%);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:12px;white-space:nowrap}
.pending-item:hover{border-color:var(--accent);color:var(--accent)}
.pending-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
/* buttons */
.btn{min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer;font-size:14px;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface);border-color:color-mix(in oklch,var(--border),var(--fg) 16%)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn-primary{border-color:var(--accent);background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.88}
.btn-primary.dirty{box-shadow:0 0 0 3px color-mix(in oklch,var(--accent),transparent 75%)}
.btn-sm{min-height:32px;padding:0 10px;font-size:13px}
.btn-icon{width:32px;min-width:32px;min-height:32px;height:32px;padding:0;display:grid;place-items:center}
.btn-icon svg{width:16px;height:16px}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:color-mix(in oklch,var(--danger),transparent 92%)}
.btn-confirm{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:transparent;border-color:var(--border);color:var(--fg)}
/* content */
.content-viewport{grid-area:content;overflow:auto;background:var(--surface)}
.view{display:none;min-height:100%;padding:20px 24px 32px}
.view.is-active{display:block}
.module-intro{max-width:760px;margin:0 0 16px;color:var(--muted);font-size:14px;line-height:1.7}
.panel{border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden;margin-bottom:16px}
.panel:last-child{margin-bottom:0}
/* 宽窗口收束（#3 P2）：普通流式视图的面板/导语限宽居中，表单与统计卡片不再
   过度拉伸；master-detail 的面板（含 .md-layout）保持全宽，其导语随之
   左对齐与面板对齐（居中 760px 导语悬在全宽面板上方会错位） */
.view .panel:not(:has(.md-layout)){max-width:1100px;margin-left:auto;margin-right:auto}
.view:not(:has(.md-layout))>.module-intro{margin-left:auto;margin-right:auto}
/* empty state */
.empty-state{padding:48px 24px;text-align:center;color:var(--muted)}
.empty-state>svg{display:block;margin:0 auto 12px}
.empty-state p{margin-bottom:16px;font-size:15px}
.empty-state-inline{padding:32px 24px;text-align:center;color:var(--muted)}
.empty-state-inline p{margin-bottom:12px;font-size:15px}
/* section bar */
.section-bar{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border)}
.section-title{font-size:15px;font-weight:600}
.count{color:var(--muted);font-size:13px}
.section-actions{display:flex;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px}
.chip-x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.chip-x:hover{color:var(--danger)}
.models-actions{display:flex;gap:8px;align-items:center}
.models-error{color:var(--danger);font-size:13px;margin-top:8px;min-height:14px}
/* master-detail */
.md-layout{display:grid;grid-template-columns:240px minmax(0,1fr)}
.content-viewport:has(.md-layout){overflow:hidden}
.content-viewport:has(.md-layout) .view.is-active{display:flex;flex-direction:column;min-height:0}
.content-viewport:has(.md-layout) .panel:has(.md-layout){min-height:0;display:flex;max-height:calc(100vh - 220px)}
.md-layout{flex:1;min-height:0}
.md-master{display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0}
.md-list{padding:8px;flex:1;overflow-y:auto}
.md-row{width:100%;min-height:52px;display:grid;grid-template-columns:8px minmax(0,1fr);align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.md-row:hover{background:var(--surface)}
.md-row.is-selected{border-color:var(--border);background:var(--surface)}
/* dot 语义：彩色=启用/当前，灰色=停用/非当前（master 列表行与图例共用） */
.md-master .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.md-master .dot.off{background:var(--muted)}
.md-legend{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;white-space:nowrap}
.md-legend .dot{margin-left:6px}
.md-legend .dot:first-child{margin-left:0}
.md-row strong{display:block;font-family:var(--font-mono);font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-row .sub{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md-master-footer{padding:10px;border-top:1px solid var(--border)}
.md-master-footer .btn{width:100%}
.md-detail{display:flex;flex-direction:column;min-width:0;min-height:0}
.detail-bar{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border)}
.detail-bar h2{font-family:var(--font-mono);font-size:16px;font-weight:600}
.detail-body{padding:20px;overflow-y:auto}
/* 内层滚动渐隐提示（纯 CSS，background-attachment 双层技巧）：随内容滚动的
   local --bg 色带盖住固定（scroll）的边缘阴影，滚离哪端就露出哪端——
   顶部阴影=上方还有内容，底部阴影=下方还有内容；内容不满时两端都不显示。 */
.md-list,.detail-body{
  background:
    linear-gradient(var(--bg) 45%,transparent) center top/100% 22px no-repeat,
    linear-gradient(transparent,var(--bg) 55%) center bottom/100% 22px no-repeat,
    linear-gradient(color-mix(in oklch,var(--fg),transparent 88%),transparent) center top/100% 8px no-repeat,
    linear-gradient(transparent,color-mix(in oklch,var(--fg),transparent 88%)) center bottom/100% 8px no-repeat;
  background-attachment:local,local,scroll,scroll;
}
/* form sections */
.form-section{padding:16px 0}
.form-section:first-child{padding-top:0}
.form-section+.form-section{border-top:1px solid var(--border)}
.form-section h3{font-size:14px;font-weight:600;margin-bottom:12px}
/* 区块头/表头前置图标（ICONS 单笔触语言）：14px、muted、与文字基线对齐 */
.form-section h3,.fw-head h3{display:flex;align-items:center;gap:6px}
.form-section h3 svg,.fw-head h3 svg{flex:0 0 auto;color:var(--muted)}
/* fields */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;margin-bottom:5px;color:var(--muted);font-size:13px;font-weight:550}
.control,.select-control{width:100%;min-height:38px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);font-size:14px}
.control:focus,.select-control:focus{border-color:var(--accent)}
.control.mono,.select-control.mono{font-family:var(--font-mono)}
.control.invalid,.select-control.invalid{border-color:var(--danger);background:color-mix(in oklch,var(--danger),var(--bg) 94%)}
.field-error{margin-top:4px;color:var(--danger);font-size:12px;line-height:1.4}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field-grid .span-2{grid-column:1/-1}
.field-hint{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.5}
/* segmented control + template row (#3) */
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg-btn{min-height:34px;padding:0 16px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:550}
.seg-btn+.seg-btn{border-left:1px solid var(--border)}
.seg-btn[aria-pressed=true]{background:var(--accent);color:#fff}
.tpl-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
/* key field */
.key-field{position:relative}
.key-field .control{padding-right:40px}
.key-toggle{position:absolute;top:0;right:0;width:38px;height:38px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.key-toggle:hover{background:var(--surface);color:var(--fg)}
.key-toggle svg{width:16px;height:16px}
/* switch */
.switch-line{display:flex;align-items:center;gap:10px}
.switch{width:44px;height:28px;position:relative;flex:0 0 auto;padding:0;border:0;border-radius:8px;background:transparent;cursor:pointer}
.switch::before{content:"";width:44px;height:28px;position:absolute;top:0;left:0;border:1px solid var(--border);border-radius:999px;background:var(--surface);transition:.18s}
.switch::after{content:"";width:18px;height:18px;position:absolute;top:5px;left:5px;border-radius:50%;background:var(--muted);transition:.18s}
.switch[aria-checked=true]::before{border-color:var(--ok);background:var(--ok)}
.switch[aria-checked=true]::after{transform:translateX(16px);background:var(--bg)}
.switch-label{color:var(--muted);font-size:13px}
/* toggle row */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border:0}
.toggle-row label{color:var(--fg);font-size:14px}
/* settings grid */
.settings-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px}
.settings-row .field{margin:0}
.settings-full{padding:0 20px 16px}
.panel-hint{color:var(--muted);font-size:13px;margin:8px 0 0}
/* routing */
.route-slot{padding:16px 20px;border-bottom:1px solid var(--border)}
.route-slot:last-child{border:0}
.route-slot .field{margin-bottom:0}
/* rules */
.rules-table{width:100%;border-collapse:collapse}
.rules-table th{height:40px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:550;letter-spacing:.04em;text-align:left}
.rules-table td{padding:8px 12px;border-bottom:1px solid var(--border)}
.rules-table tbody tr:last-child td{border:0}
.rule-num{color:var(--muted);font-family:var(--font-mono);font-size:13px}
/* port forwards (tunnel detail) */
.fw-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.fw-head h3{margin:0}
.fw-hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.fw-table input.control{width:100%;min-width:0}
.fw-table td{vertical-align:middle}
.fw-actions{display:flex;align-items:center;gap:6px;white-space:nowrap}
.fw-status{font-size:12px;color:var(--muted)}
.nfs-errmsg{color:var(--danger);font-size:11px;margin:4px 0 0;max-width:280px;word-break:break-all}
.fw-status.ok{color:var(--ok)}
.fw-status.err{color:var(--danger)}
.fw-empty td{padding:16px 12px;color:var(--muted);font-size:13px;text-align:center}
.fw-empty svg{vertical-align:-4px;margin-right:7px}
/* multi-active tunnel badges */
.fw-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;font-size:11px;line-height:1.5;background:color-mix(in oklch,var(--accent),transparent 88%);color:var(--accent)}
/* ── 服务器视图（v0.13.0 PR-2）：master 标签行 + 服务 tab + 探针结果 ── */
.md-row .srv-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;line-height:1.6;padding:0 7px;border-radius:999px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.tag svg{flex:0 0 auto}
.tag.proxy{border-color:var(--ok);color:var(--ok);font-weight:600}
.tag.on{color:var(--fg)}
.detail-bar.srv{flex-wrap:wrap;row-gap:6px;column-gap:8px;padding:8px 20px}
.detail-title-wrap{display:flex;align-items:baseline;gap:10px;min-width:0}
.srv-title{min-height:34px;min-width:140px;max-width:280px;padding:2px 6px;border:0;border-bottom:1px dashed var(--border);border-radius:0;background:transparent;color:var(--fg);font-size:16px;font-weight:600}
.srv-title:focus{border-bottom-color:var(--accent)}
.srv-id{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 服务 tab 条（真机验收反馈：服务卡纵向堆叠 → 横向 tab）——下划线式
   活动态贴合极简基调；pane 全量常驻渲染，inactive 走全局 [hidden] */
.svc-tabs{display:flex;gap:2px;padding:0 20px;border-bottom:1px solid var(--border)}
.svc-tab{position:relative;display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:550;cursor:pointer}
.svc-tab:hover{color:var(--fg)}
.svc-tab.is-active{color:var(--accent)}
.svc-tab.is-active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px 2px 0 0;background:var(--accent)}
.svc-tab-count{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.svc-tab.is-active .svc-tab-count{color:inherit}
.svc-pane{margin-top:10px}
.service-card{border:1px solid var(--border);border-radius:8px;background:var(--bg);margin-top:10px;overflow:hidden}
.service-card.disabled{border-style:dashed}
.service-card-head{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.svc-icon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;border:1px solid var(--border);background:var(--surface);flex:0 0 auto}
.svc-icon svg{width:16px;height:16px}
.svc-title{font-weight:600;font-size:14px}
.svc-sub{color:var(--muted);font-size:12px}
.grow{flex:1}
.state-badge{display:inline-flex;align-items:center;font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 9px;white-space:nowrap}
.state-badge.on{color:var(--fg)}
.service-card-body{padding:14px}
/* 探针结果区（PR-2 占位结构，PR-3 接线）：空 = 隐藏，写入即现 */
.probe-result{margin:0 14px;padding:9px 12px;border-radius:7px;background:var(--surface);font-size:13px;line-height:1.6;word-break:break-all}
.probe-result:empty{display:none}
.soon{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:0 7px;vertical-align:2px}
.vpn-ph{padding:14px;color:var(--muted);font-size:13px;line-height:1.8}
/* statusbar */
.statusbar{grid-area:status;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
.statusbar #status-left.dirty{color:var(--accent);font-weight:550}
/* toast */
.toast{min-width:200px;max-width:400px;position:fixed;right:24px;bottom:24px;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--fg);border-radius:8px;background:var(--fg);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s}
.toast.is-visible{opacity:1;transform:translateY(0)}
.toast.err{border-color:var(--danger);background:var(--danger)}
/* CC 同步确认弹窗（#3 验收 9）：挂在 body 上，不被 #viewport 重渲染清除 */
.cc-modal-overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:color-mix(in oklch,var(--bg),transparent 35%);backdrop-filter:blur(2px)}
.cc-modal{width:min(680px,calc(100vw - 48px));max-height:calc(100vh - 96px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgb(0 0 0/25%);padding:20px}
.cc-modal h3{font-size:16px;margin:0 0 10px}
.cc-modal-target{font-size:13px;margin:0 0 10px;color:var(--muted)}
.cc-modal-target code{color:var(--fg)}
.cc-modal-sec{font-size:13px;font-weight:600;margin:0 0 6px}
.cc-diff-scroll{overflow:auto;min-height:0;border:1px solid var(--border);border-radius:6px}
.cc-diff-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.cc-diff-table th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--border)}
.cc-diff-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
.cc-diff-table tr:last-child td{border-bottom:none}
.cc-diff-table td.mono{font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.cc-diff-table th:nth-child(1),.cc-diff-table td:nth-child(1){width:38%}
.cc-diff-table th:nth-child(2),.cc-diff-table td:nth-child(2){width:52px;text-align:center}
.cc-diff-table th:nth-child(3),.cc-diff-table td:nth-child(3),
.cc-diff-table th:nth-child(4),.cc-diff-table td:nth-child(4){width:27%}
.cc-badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;white-space:nowrap}
.cc-badge-新增{background:color-mix(in oklch,var(--ok),transparent 82%);color:var(--ok)}
.cc-badge-修改{background:color-mix(in oklch,var(--accent),transparent 82%);color:var(--accent)}
.cc-badge-移除{background:color-mix(in oklch,var(--danger),transparent 82%);color:var(--danger)}
/* ── 快速接入向导（ADR-010 M5）── */
.qs-vendors{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.qs-vendor{min-height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:13px;font-weight:550}
.qs-vendor:hover{border-color:color-mix(in oklch,var(--fg),var(--border) 60%)}
.qs-vendor.is-active{border-color:var(--accent);color:var(--accent);background:color-mix(in oklch,var(--accent),transparent 86%)}
.qs-actions{display:flex;gap:8px;align-items:center;margin-top:14px}
.qs-agents td{vertical-align:middle}
.qs-agent-main{font-weight:550;font-size:14px}
.qs-agent-sub{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.qs-state-ok{color:var(--ok);font-size:13px}
.qs-state-muted{color:var(--muted);font-size:13px}
.qs-state-default{font-size:13px}
.qs-state-err{color:var(--danger);font-size:13px}
.qs-agents tr.qs-disabled td{opacity:.55}
.qs-agents tbody tr:not(.qs-disabled){cursor:pointer}
.qs-agents tbody tr:not(.qs-disabled):hover td{background:var(--surface)}
/* 宽窗口防护：快速接入是表单页，不加宽度上限时 field-grid 两列会被
   拉到 700px+（2000px 窗口实测），比例失衡——面板限宽居中，导语
   与面板同宽对齐（而非全站 760px） */
.qs-narrow .panel.panel{max-width:960px;margin-left:auto;margin-right:auto}
.qs-narrow>.module-intro{max-width:960px}
.cc-modal-backup{font-size:12px;margin:10px 0 0;color:var(--muted)}
.cc-modal-hint{font-size:12px;margin:4px 0 0;color:var(--muted)}
.cc-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
/* balance + usage statistics */
.stat-card{padding:16px 20px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.s-primary{font-size:19px;font-weight:600;font-family:var(--font-mono)}
.s-secondary{color:var(--muted);font-size:13px;margin-top:2px}
.pct-ok{color:var(--ok)!important}.pct-warn{color:var(--warn)!important}.pct-danger{color:var(--danger)!important}
.s-label{color:var(--muted);font-size:12px;margin-top:8px;margin-bottom:2px}
/* 余额速览：卡片式列表（方案 A——等高卡片 + 内嵌进度条 + 右对齐余额） */
.bal-list{display:flex;flex-direction:column;gap:8px}
.bal-card{display:flex;align-items:flex-start;gap:16px;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);min-height:72px;box-sizing:border-box}
.bal-card-left{flex:0 0 140px;padding-top:2px}
.bal-name{font-family:var(--font-mono);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal-card-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bal-plan-line{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.bal-plan-label{font-size:13px;color:var(--muted)}
.bal-plan{font-size:14px;font-weight:600;margin:0}
.bal-quotas{display:flex;flex-direction:column;gap:4px}
.bal-quota{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}
.bal-quota .bal-period{color:var(--muted);min-width:52px;flex:none}
.bal-progress{width:120px;height:6px;border-radius:3px;background:var(--border);overflow:hidden;flex:none}
.bal-progress-fill{height:100%;border-radius:3px;transition:width .3s ease}
.bal-quota .bal-nums{color:var(--muted);font-family:var(--font-mono);font-size:12px;flex:none;min-width:140px}
.bal-quota .bal-reset{color:var(--muted);font-size:12px;flex:1;min-width:0}
.bal-money{text-align:right;flex:0 0 160px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:52px}
.bal-money-label{font-size:12px;color:var(--muted);margin:0}
.bal-money-value{font-size:18px;font-weight:600;font-family:var(--font-mono);line-height:1.2}
.bal-money-sub{font-size:12px;color:var(--muted)}
.bal-empty{display:flex;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px}
.bal-error{color:var(--danger)}
/* 旧表格样式保留（过渡期可回退） */
.balance-table td{vertical-align:top;padding:12px}
.bal-api{display:flex;align-items:baseline;gap:8px}
.bal-api .s-label,.bal-money .s-label{margin:0}
.bal-api+.bal-api{margin-top:8px}
.bal-quotas-old{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.bal-quota-old{font-size:13px;white-space:nowrap}
.bal-money-api+.bal-money-api{margin-top:12px}
.usage-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.usage-summary .stat-card:nth-last-child(-n+3){border-bottom:0}
.usage-summary .stat-card strong{font-size:21px;font-weight:600;font-family:var(--font-mono)}
.usage-summary .stat-card span{display:block;color:var(--muted);font-size:12px}
.range-switch{display:inline-flex;padding:2px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.range-btn{min-height:28px;padding:0 9px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:550}
.range-btn:hover{color:var(--fg)}
.range-btn.is-active{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px color-mix(in oklch,var(--fg),transparent 90%)}
.table-scroll{overflow-x:auto}
.usage-table{min-width:720px}
/* 每日趋势轻量柱状图：内联 SVG，无外部库；currentColor 之外只用 --accent，
   深浅主题自动适配。max-width 由渲染函数按天数内联设置（防宽窗口拉伸变形）。 */
.daily-bars{padding:12px 16px 4px;overflow:hidden}
.daily-bars svg{display:block;width:100%;height:48px}
.daily-bars rect{fill:var(--accent)}
.daily-bars rect:hover{opacity:.65}
.cache-hint{display:block;max-width:240px;margin-top:3px;color:var(--warn);font-size:11px;line-height:1.4}
.loading-text{padding:24px;color:var(--muted);font-size:14px}
@media(max-width:980px){.app-shell{grid-template-columns:200px minmax(0,1fr)}.md-layout{grid-template-columns:200px minmax(0,1fr)}.section-actions .count{display:none}}
</style>

<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i></div>
      <div><div class="brand-name">Magic Stack</div><div class="brand-subtitle">设置</div></div>
    </div>
    <div id="nav-container"></div>
    <div class="priority-note"><strong>保存后生效</strong>隧道变更需菜单「重新连接」；端口转发保存后自动重连；AI 路由保存后自动重载。</div>
    <div class="sidebar-ai-helper"><button class="btn btn-sm btn-ghost" onclick="copyAgentInstructions()">复制 AI 助手指令</button></div>
  </aside>
  <main class="workbench">

      <div class="pending-actions"><button class="btn btn-sm" id="pending-discard-btn" onclick="discardAll()">放弃全部</button><button class="btn btn-sm btn-primary" id="pending-save-btn" onclick="saveAll()">保存全部</button></div>
    </div>
    <div class="content-viewport" id="viewport"><section class="view is-active"><p class="loading-text">加载中…</p></section></div>
    <footer class="statusbar"><span id="status-left">就绪</span><span id="shortcut-hint">⌘S 保存</span></footer>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg">已保存</span></div>

<script data-layer="model">
'use strict';
// ── i18n（ADR-012 M2）：window.__I18N__ 由 config_server 在 serve 时注入
// （浏览器路径）；node 分层求值由 tests/js/extract.mjs 注入同款 t——
// zh catalog 是唯一中文真相源，键缺席回显键名（可见但不炸）。──
const I18N=(typeof window!=='undefined'&&window.__I18N__)||{lang:'zh-CN',messages:{}};
function tt(key,params){
  let s=(I18N.messages[I18N.lang]||{})[key];
  if(s==null)s=(I18N.messages['zh-CN']||{})[key];
  if(s==null)return key;
  if(params)s=s.replace(/\{(\w+)\}/g,(_,k)=>params[k]!=null?String(params[k]):'{'+k+'}');
  return s;
}
// ════════════════════════════════════════════════════════════════
// LAYER 1 — data & pure logic (no DOM access; mirrored by node tests
// in tests/js/, extracted via the <script data-layer> boundaries).
// ════════════════════════════════════════════════════════════════
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function normalizeState(raw){
  // Shape whatever the server returned into the canonical in-memory model.
  const S=raw||{};
  S.mp=S.mp||{};S.sp=S.sp||{};
  S.mp.servers=S.mp.servers||[];
  S.sp.providers=S.sp.providers||{};
  S.sp.router=S.sp.router||{};
  S.sp.rules=S.sp.rules||[];
  return S;
}
function cloneData(value){
  return value==null?value:JSON.parse(JSON.stringify(value));
}
function countChanges(before,after){
  // Count changed leaves, with an added/removed object or array item treated
  // as one user-visible change.  This powers both the dirty boolean and the
  // per-page change counts shown in the pending bar.
  if(Object.is(before,after))return 0;
  if(before==null||after==null)return 1;
  const beforeArray=Array.isArray(before),afterArray=Array.isArray(after);
  if(beforeArray||afterArray){
    if(!beforeArray||!afterArray)return 1;
    let total=Math.abs(before.length-after.length);
    for(let i=0;i<Math.min(before.length,after.length);i++)total+=countChanges(before[i],after[i]);
    return total;
  }
  if(typeof before==='object'&&typeof after==='object'){
    let total=0;
    const keys=new Set([...Object.keys(before),...Object.keys(after)]);
    keys.forEach(key=>{
      if(!Object.prototype.hasOwnProperty.call(before,key)||!Object.prototype.hasOwnProperty.call(after,key))total++;
      else total+=countChanges(before[key],after[key]);
    });
    return total;
  }
  return 1;
}
function numberDefault(value,fallback){
  if(value==null||value==='')return fallback;
  const n=Number(value);return Number.isFinite(n)?n:fallback;
}
// #53 声明：__saved_api_key__ / __saved_password__ 是脏检查投影层的
// 占位哨兵（viewSnapshot/dirtyProjection 专用）——collect() 从表单读到
// 空值即回写 null，哨兵永不上 PUT 线、永不入 S.sp/S.mp 持久态。
// NFS 视图投影（ADR-007）：collect 的缺省口径与本投影同一语义——空端口
// =12049、空字段=''、auto_mount 严格布尔，未触碰的隧道不产生假 dirty。
// nfs_states 装饰值归一（对象 {status,error,fixable}；字符串 = 旧形状
// 兼容测试夹具）——可见性链路：分类(fixable)→投影→装饰→此处→状态单元格
function nfsStateValue(v){
  if(v==null)return{status:'unmounted',error:'',fixable:''};
  if(typeof v==='string')return{status:v,error:'',fixable:''};
  return{status:v.status||'unmounted',error:v.error||'',fixable:v.fixable||''};
}
function nfsStateOf(states,name){
  return nfsStateValue((states||{})[name]);
}
// 计数与状态单元格共用同一形状归一——nfs_states 生产形状是对象，
// 字符串比较会把对象形状全部漏计
// 模型层形状归一参照（消费方含 model.test）；UI master 徽标用 mounts.length
function _nfsMountedCount(t){
  return Object.values(t.nfs_states||{}).filter(v=>nfsStateValue(v).status==='mounted').length;
}
// 运行态装饰定向合并：只动装饰字段，绝不覆盖表单字段（dirty 真相在
// 表单）——曾有的坑：整页 renderView 会冲掉未保存的编辑
function mergeRuntimeDecorations(S,fetched){
  const fm=(fetched&&fetched.mp)||{};
  const byId={};
  (fm.servers||[]).forEach(t=>{if(t&&t.id)byId[t.id]=t;});
  (S.mp.servers||[]).forEach(t=>{
    if(!t||!t.id)return;
    const f=byId[t.id];if(!f)return;
    t.nfs_states=f.nfs_states||{};
    t.is_proxy=f.is_proxy===true;
    t.forward_running=f.forward_running===true;
    t.has_password=f.has_password===true;
  });
  if('capture_active' in fm)S.mp.capture_active=fm.capture_active===true;
  return S;
}

function nfsProjection(n){
  n=n||{};
  return{
    enabled:n.enabled===true,
    local_port:numberDefault(n.local_port,12049),
    squash_to_ssh_user:n.squash_to_ssh_user===true,
    mounts:(n.mounts||[]).map(m=>({
      name:(m&&m.name)||'',
      remote_path:(m&&m.remote_path)||'',
      local_dir:(m&&m.local_dir)||'',
      auto_mount:!!m&&m.auto_mount===true,
    })),
  };
}
function viewSnapshot(view,state,roles){
  // Project the shared config into the values owned by one settings page.
  // Defaults match what the form renders, preventing an untouched omitted
  // value from becoming a false change merely because collect() filled it in.
  const mp=(state&&state.mp)||{},sp=(state&&state.sp)||{};
  if(view==='servers')return{
    // v0.13.0 服务器单视图：ssh + forwards + nfs 同页同投影（吞并旧
    // tunnel/nfs 两键）。角色真相是 proxy_server_id（稳定 id）；派生面
    // 不入 dirty（服务器删除/调序不应伪造角色变更）。
    // is_proxy/forward_running/nfs_states 是服务端运行态装饰（不入快照
    // ——非用户可编辑面，prepare 的 READONLY_DECORATED_FIELDS 剥除）
    proxy_server_id:(mp.proxy_server_id==null?'':String(mp.proxy_server_id)),
    servers:(mp.servers||[]).map(t=>({
      id:t.id||'',name:t.name||'',ssh_user:sshOf(t).user||'',ssh_host:sshOf(t).host||'',
      ssh_port:numberDefault(sshOf(t).port,22),auth_type:sshOf(t).auth_type||'key',
      ssh_key:sshOf(t).ssh_key||'',ssh_compression:sshOf(t).compression!==false,
      password:t.password||(t.has_password?'__saved_password__':''),
      autostart:autostartOf(t),
      // collect 的缺省口径：空端口=0、空地址=127.0.0.1（与服务端 merge
      // 归一同一语义），未触碰行不产生假 dirty。
      forwards:forwardsOf(t).map(f=>({
        local_port:numberDefault(f.local_port,0),
        remote_host:f.remote_host||'127.0.0.1',
        remote_port:numberDefault(f.remote_port,0),
        enabled:f.enabled!==false,
      })),
      // NFS 面与旧 'nfs' 视图同一投影（nfsProjection 缺省口径 = collect）
      nfs:nfsProjection(nfsOf(t)),
    })),
  };
  if(view==='proxy')return{
    socks5_port:numberDefault(mp.socks5_port,1080),
    http_listen_port:numberDefault(mp.http_listen_port,8888),
    capture_port:numberDefault(mp.capture_port,8080),
    capture_dir:mp.capture_dir||'~/.magic-proxy-captures',
    retention_days:numberDefault(mp.retention_days,7),
    config_port:numberDefault(mp.config_port,9528),
    listen_port:numberDefault(sp.listen_port,9527),
  };
  if(view==='system')return{
    system_proxy_default:mp.system_proxy_default===true,
    prevent_sleep:mp.prevent_sleep===true,
    launch_at_login:mp.launch_at_login===true,
    config_api_enabled:mp.config_api_enabled===true,
  };
  if(view==='providers'){
    const providers={};
    Object.keys(sp.providers||{}).sort().forEach(name=>{
      const p=sp.providers[name]||{};
      providers[name]={
        id:p.id||'',
        base_url:p.base_url||'',
        api_key:p.api_key||(p.api_key_set?'__saved_api_key__':''),
        api_key_env:p.api_key_env||'',auth_header:p.auth_header||'',
        models:Array.isArray(p.models)?[...p.models]:[],
        anthropic_native:p.anthropic_native===true,enabled:p.enabled!==false,
      };
    });
    return providers;
  }
  if(view==='rules'){
    const roleState={};
    Object.keys(roles||{}).sort().forEach(key=>{
      const role=roles[key]||{};
      roleState[key]={model:role.model||'',name:role.name||'',ctx_1m:role.ctx_1m!==false};
    });
    return{default_model:(sp.router||{}).default||'',rules:cloneData(sp.rules||[]),roles:roleState};
  }
  return null;
}
// #70 S1：路由目标文法镜像 suanpan/router.parse_route_target（"/" 优先
// "," 兜底）——单一所有者；不再散点 split('/')。
function parseTarget(t){
  t=String(t||'');
  const sep=t.includes('/')?'/':(t.includes(',')?',':'/');
  const i=t.indexOf(sep);
  return i<0?[t,'']:[t.slice(0,i),t.slice(i+1)];
}
function validateConfig(S){
  // Pre-save validation; returns a list of human-readable error strings.
  const errors=[];
  if(S&&S.sp&&S.sp._load_error)errors.push(tt('ui.validate.sp_load_error')+S.sp._load_error);
  if(S&&S.mp&&S.mp._load_error)errors.push(tt('ui.validate.mp_load_error')+S.mp._load_error);
  (S.mp.servers||[]).forEach((t,i)=>{
    if(!sshOf(t).host)errors.push(tt('ui.validate.addr',{n:i+1}));
    if(sshOf(t).port&&(sshOf(t).port<1||sshOf(t).port>65535))errors.push(tt('ui.validate.ssh_port',{n:i+1}));
    // 端口转发行：范围 + 同服务器重复 + remote_host 文法（镜像 prepare 的
    // 中文文案——prepare 是 422 兜底，这里是保存前第一道；v2 模型是
    // 服务器，文案随 Python 侧同轴）
    const tn=t.name||sshOf(t).host||(tt('ui.validate.server_n',{n:i+1}));
    // OpenVPN 面（镜像 mpconf/validate._vpn_errors：auth 枚举 + userpass
    // 须用户名——双侧同错同净，校验镜像纪律）
    const vo=t.services&&t.services.openvpn;
    if(vo){
      if(vo.auth&&vo.auth!=='none'&&vo.auth!=='userpass')errors.push(tt('ui.validate.vpn_auth',{tn}));
      if(vo.auth==='userpass'&&!String(vo.username||'').trim())errors.push(tt('ui.validate.vpn_user',{tn}));
    }
    const fwSeen={};
    forwardsOf(t).forEach(f=>{
      // 与 prepare 同口径：端口须整数（拦小数），remote_host 字串化
      // （数字形态仅在直改 state 时出现，String 兜底不抛 TypeError）
      const lp=f.local_port,rp=f.remote_port,rh=String(f.remote_host||'127.0.0.1');
      if(!Number.isInteger(lp)||lp<1||lp>65535)errors.push(tt('ui.validate.fw_local_port',{tn}));
      else if(f.enabled===false){/* 停用行不占端口，重复也不拦 */}
      else if(fwSeen[lp])errors.push(tt('ui.validate.fw_dup',{tn,lp}));
      else fwSeen[lp]=1;
      if(!Number.isInteger(rp)||rp<1||rp>65535)errors.push(tt('ui.validate.fw_remote_port',{tn}));
      if(/\s/.test(rh)||rh.includes(':'))errors.push(tt('ui.validate.fw_remote_host',{tn}));
    });
    // NFS 本地端口行级形状（镜像 prepare 的 _nfs_errors；无效值不再
    // 进冲突命名空间——两个错误不得叠加报）
    const n=nfsOf(t);
    if(n&&typeof n==='object'){
      const np=n.local_port;
      if(np!=null&&np!==''&&(!Number.isInteger(np)||np<1||np>65535))
        errors.push(tt('ui.validate.nfs_port',{tn}));
    }
  });
  // 端口行级校验共享跳过语义：null/''/undefined = 未填跳过；显式 0
  // 等非法值必报（曾因 falsy 短路漏 0——listen_port=0 过第一道闸
  // 只在 422 现形，与 R1-C5 的 NFS 端口同类洞；跨语言报警
  // test_validation_mirror 钉住与 prepare 的同错同净）
  const portInvalid=v=>v!=null&&v!==''&&(v<1||v>65535);
  if(portInvalid(S.mp.socks5_port))errors.push(tt('ui.validate.socks5_port'));
  if(portInvalid(S.mp.http_listen_port))errors.push(tt('ui.validate.http_port'));
  if(portInvalid(S.mp.capture_port))errors.push(tt('ui.validate.capture_port'));
  if(portInvalid(S.mp.config_port))errors.push(tt('ui.validate.config_port'));
  if(portInvalid(S.sp.listen_port))errors.push(tt('ui.validate.gw_port'));
  // Port uniqueness across services — a duplicate only fails at bind time
  // otherwise, long after the user left the form. Absent values are skipped
  // (collect() fills defaults once the view has been visited).
  const portRefs=[['SOCKS5',S.mp.socks5_port],[tt('ui.portlabel.http'),S.mp.http_listen_port],[tt('ui.portlabel.capture'),S.mp.capture_port],[tt('ui.portlabel.config'),S.mp.config_port],[tt('ui.portlabel.gw'),S.sp.listen_port]];
  const seen={};
  portRefs.forEach(([label,p])=>{
    if(p==null||p==='')return;
    if(seen[p])errors.push(tt('ui.validate.port_conflict',{a:seen[p],b:label,p}));
    else seen[p]=label;
  });
  // 转发本地端口全局唯一（多活 v0.9：任意隧道可并行，抢同端口会让两条
  // ssh 在 ExitOnForwardFailure 下互顶）；镜像 prepare 同一判定
  (S.mp.servers||[]).forEach(t=>{
    const tn=t.name||sshOf(t).host||tt('ui.validate.server_plain');
    forwardsOf(t).forEach(f=>{
      const lp=f.local_port;
      const ref=tt('ui.validate.fw_ref',{tn});
      if(f.enabled===false)return;  // 停用行不进会话 -L、不占本地端口
      if(lp){
        if(seen[lp])errors.push(tt('ui.validate.port_conflict',{a:seen[lp],b:ref,p:lp}));
        else seen[lp]=ref;
      }
    });
  });
  // NFS 本地端口进同一命名空间（镜像 prepare 的「实际在用才占端口」：
  // enabled 或配置了挂载；merge 填的纯默认节点不占——两条隧道不得互报
  // 假冲突）。曾漏：NFS×转发/全局端口撞车过第一道闸、只在 422 现形
  (S.mp.servers||[]).forEach(t=>{
    const n=nfsOf(t);
    if(!n||typeof n!=='object')return;
    if(!(n.enabled===true||(n.mounts&&n.mounts.length)))return;
    const np=n.local_port;
    if(!Number.isInteger(np)||np<1||np>65535)return;  // 形状归行级校验
    const tn=t.name||sshOf(t).host||tt('ui.validate.server_plain');
    const ref=tt('ui.validate.nfs_ref',{tn});
    if(seen[np])errors.push(tt('ui.validate.port_conflict',{a:seen[np],b:ref,p:np}));
    else seen[np]=ref;
  });
  Object.entries(S.sp.providers||{}).forEach(([k,p])=>{
    if(!k||!k.trim())errors.push(tt('ui.validate.provider_name'));
    // 对齐 suanpan/config.py ProviderConfig._check_auth：环境变量凭证必须显式选择认证头
    if(p&&p.api_key_env&&!p.auth_header)errors.push(tt('ui.validate.provider_env_auth',{k}));
  });
  // #3 悬空引用：规则/默认路由指向的供应商必须存在，否则网关路由落空。
  const providerNames=new Set(Object.keys(S.sp.providers||{}));
  (S.sp.rules||[]).forEach((r,i)=>{
    const t=(r&&r.route_to)||'',pk=parseTarget(t)[0];
    if(t&&!providerNames.has(pk))errors.push(tt('ui.validate.rule_missing_provider',{n:i+1,pk}));
  });
  const defRoute=(S.sp.router||{}).default||'',defPk=parseTarget(defRoute)[0];
  if(defRoute&&!providerNames.has(defPk))errors.push(tt('ui.validate.default_missing_provider',{pk:defPk}));
  return errors;
}

function parseAddr(s){
  // IPv6-safe: supports user@host, user@[::1], user@host:port, user@[::1]:22
  let user='',hostPart=s;
  const at=s.lastIndexOf('@');
  if(at>=0){user=s.substring(0,at);hostPart=s.substring(at+1);}
  let host=hostPart;
  const bm=hostPart.match(/^\[([^\]]+)\](?::(\d+))?$/);
  if(bm)host=bm[1];
  else if(hostPart.split(':').length<=2){const ci=hostPart.lastIndexOf(':');if(ci>=0)host=hostPart.substring(0,ci);}
  return{user,host};
}

const EDITABLE_VIEWS=['servers','proxy','providers','rules','system'];
function dirtyProjection(base,S,baseRoles,roles){
  // 纯派生：哪些页面有真实 diff、各几项。recomputeDirty 与 saveFlow 共用，
  // 保证「按钮上的计数」与「保存流实际处理范围」永远同一口径。
  const views=new Set(),counts=new Map();
  EDITABLE_VIEWS.forEach(view=>{
    const n=countChanges(viewSnapshot(view,base,baseRoles),viewSnapshot(view,S,roles));
    if(n){views.add(view);counts.set(view,n);}
  });
  return{views,counts,total:[...counts.values()].reduce((s,n)=>s+n,0)};
}
function forwardsChanged(base,S){
  // 兼容别名（v0.8 语义消费者）：当前代理隧道的 forwards 是否有变。
  return changedForwardTunnels(base,S).length>0;
}
function changedForwardTunnels(base,S){
  // 多活（v0.9）：返回 forwards 有变的隧道 id 数组——saveFlow 对「正在
  // 运行的」逐隧道触发守卫重连（代理隧道走代理守卫；转发会话按各自
  // 连接态定向守卫），未运行的不拉起。
  const sig=t=>forwardsOf(t).map(f=>`${f.local_port}|${f.remote_host}|${f.remote_port}|${f.enabled===false?0:1}`).join(';');
  const byId=st=>{const m={};((st&&st.mp&&st.mp.servers)||[]).forEach(t=>{if(t&&t.id)m[t.id]=t;});return m;};
  const a=byId(base),b=byId(S);
  const out=[];
  for(const id of new Set([...Object.keys(a),...Object.keys(b)])){
    if(sig(a[id])!==sig(b[id]))out.push(id);
  }
  return out;
}
// 代理角色 → 隧道下标（纯函数，按任意 state 解析）：id 真相 → 悬空/缺省
// 回退旧下标并钳制——与服务端 merge 的解析序同一语义
function proxyIndexOf(st){
  const mp=(st&&st.mp)||{},ts=(mp.servers)||[];
  const cid=mp.proxy_server_id||'';
  if(cid){
    const i=ts.findIndex(t=>t&&t.id===cid);
    if(i>=0)return i;
  }
  return 0;  // id 悬空/缺省回退首条（与服务端 merge 同一解析序）
}
async function saveFlow(snap,deps,forceRulesSync){
  const{S,ccRoles,baselineState,baselineRoles}=snap;
  const proj=dirtyProjection(baselineState,S,baselineRoles,ccRoles);
  const dirty=proj.views.size>0;
  const rolesChanged=countChanges(baselineRoles,ccRoles)>0;
  const syncRules=forceRulesSync===true||rolesChanged;
  const out={configSaved:false,syncOk:false,cancelled:false};
  if(!dirty&&!syncRules){deps.toast(tt('ui.saveflow.nothing'));return out;}
  if(dirty){
    const errors=validateConfig(S);
    if(errors.length){deps.toast(errors.slice(0,3).join(tt('ui.common.list_sep'))+(errors.length>3?tt('ui.saveflow.more_errors',{n:errors.length}):''),true);deps.gotoFirstError(errors[0]);return out;}
  }
  const mpChanged=proj.views.has('servers')||proj.views.has('proxy');
  const spChanged=proj.views.has('providers')||proj.views.has('rules');
  const fwChangedIds=changedForwardTunnels(baselineState,S);
  let configSaved=false,syncMessage='';
  deps.setSaving(true,syncRules?(dirty?tt('ui.saveflow.saving_sync'):tt('ui.saveflow.syncing')):tt('ui.saveflow.saving'));
  try{
    if(dirty){
      const r=await deps.fetch(deps.api,{method:'PUT',headers:apiHeaders(deps.token,{'Content-Type':'application/json'}),body:JSON.stringify(S)});
      const d=await r.json();
      if(!d.ok){deps.toast((d.errors||[tt('ui.common.unknown_error')]).join(tt('ui.common.list_sep')),true);return out;}
      deps.commitConfig(cloneData(S));configSaved=true;out.configSaved=true;
    }
    if(syncRules){
      // #3 验收 9：写入外部 ~/.claude/settings.json 前先取只读预览并让用户
      // 确认。预览失败按失败关闭——拿不到真实 diff 就绝不落盘；already
      // 状态无变更，免确认直接走幂等路径。
      let go=true;
      try{
        const pr=await deps.fetch('/api/cc-sync-preview',{method:'POST',headers:apiHeaders(deps.token,{'Content-Type':'application/json'}),body:JSON.stringify({roles:ccRoles})});
        const pv=await pr.json();
        if(!pv.ok){go=false;deps.toast(tt('ui.saveflow.preview_fail',{msg:pv.msg||tt('ui.common.unknown_error')}),true);}
        else if(!pv.already)go=await deps.confirmSync(pv);
      }catch(e){go=false;deps.toast(tt('ui.saveflow.preview_fail',{msg:e.message}),true);}
      if(!go){
        if(configSaved){deps.stampSaved(deps.now());deps.toast(tt('ui.saveflow.saved_cc_cancelled'));}
        else deps.toast(tt('ui.saveflow.cc_cancelled'));
        out.cancelled=true;return out;
      }
      const r=await deps.fetch('/api/setup-claude-code',{method:'POST',headers:apiHeaders(deps.token,{'Content-Type':'application/json'}),body:JSON.stringify({roles:ccRoles})});
      const d=await r.json();
      if(!d.ok){deps.toast((configSaved?tt('ui.saveflow.saved_but'):'')+tt('ui.saveflow.sync_fail',{msg:d.msg||tt('ui.common.unknown_error')}),true);return out;}
      deps.commitRoles(cloneData(ccRoles));syncMessage=d.msg||tt('ui.saveflow.synced');out.syncOk=true;
    }
    deps.stampSaved(deps.now());
    if(configSaved){
      const names=[...proj.views].map(v=>deps.viewTitle(v)).join(tt('ui.common.name_sep'));
      let msg=tt('ui.saveflow.saved',{n:proj.total,names});
      if(mpChanged&&spChanged)msg+=tt('ui.saveflow.effect_both');
      else if(mpChanged)msg+=tt('ui.saveflow.effect_mp');
      else if(spChanged)msg+=tt('ui.saveflow.effect_sp');
      if(fwChangedIds.length&&deps.reconnectForwards){
        // 多活守卫重连：代理隧道保持 v0.8 语义（保存前后同身份的当前
        // 隧道才触发）；运行中的转发会话按 tunnel_id 定向守卫——原生侧
        // 按各自连接态拦，未连接/未运行的绝不拉起
        const baseIdx=proxyIndexOf(baselineState),saveIdx=proxyIndexOf(S);
        const baseCur=(baselineState.mp.servers||[])[baseIdx]||null;
        const saveCur=(S.mp.servers||[])[saveIdx]||null;
        const sameProxy=!!(baseCur&&saveCur&&baseCur.id&&saveCur.id===baseCur.id);
        const proxyId=saveCur&&saveCur.id;
        fwChangedIds.forEach(id=>{
          if(id===proxyId){
            if(sameProxy)deps.reconnectForwards(null);
          }else if(((S.mp.servers||[]).find(t=>t&&t.id===id)||{}).forward_running){
            deps.reconnectForwards(id);
          }
        });
        msg+=tt('ui.saveflow.effect_fw');
      }
      if(syncMessage)msg+='；'+syncMessage;
      deps.toast(msg);
    }else deps.toast(syncMessage);
  }catch(e){
    deps.toast((configSaved?tt('ui.saveflow.saved_then_fail'):tt('ui.saveflow.save_fail'))+e.message,true);
  }finally{
    deps.setSaving(false);
  }
  return out;
}

// ── dirty ─────────────────────────────────────────────
// 设置窗桥接：单一 bridge 通道，{type, payload} JSON；JS 拥有 DOM 与 dirty 真相
function nativeSend(type,payload){
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bridge)
    window.webkit.messageHandlers.bridge.postMessage({type:type,payload:payload||{}});
}
function notifyNative(){nativeSend('dirtyState',{dirty:dirty});}
function totalDirtyCount(){return[...dirtyCounts.values()].reduce((sum,n)=>sum+n,0);}
function recomputeDirty(){
  const p=dirtyProjection(baselineState,S,baselineRoles,ccRoles);
  dirtyViews=p.views;dirtyCounts=p.counts;dirty=dirtyViews.size>0;
  updateStatus();notifyNative();
}
function collectAndRecompute(){collect();recomputeDirty();}
function captureBaseline(saved){
  baselineState=cloneData(S);baselineRoles=cloneData(ccRoles);
  dirty=false;dirtyViews.clear();dirtyCounts.clear();
  if(saved)lastSavedAt=new Date().toLocaleTimeString(I18N.lang==='en'?'en-US':'zh-CN');
  updateStatus();notifyNative();
}
function discardAll(){
  const count=totalDirtyCount();if(!count)return;
  S=normalizeState(cloneData(baselineState));ccRoles=cloneData(baselineRoles);credModeOverride='';
  activeTunnel=Math.min(activeTunnel,Math.max(0,S.mp.servers.length-1));
  if(!S.sp.providers[activeProvider])activeProvider=Object.keys(S.sp.providers)[0]||'';
  recomputeDirty();renderNav();renderView();toast(tt('ui.pending.discarded',{n:count}));
}
function refreshPendingBar(){
  const bar=document.getElementById('pending-bar');
  const count=totalDirtyCount();bar.hidden=!dirty;
  if(!dirty)return;
  document.getElementById('pending-title').textContent=tt('ui.pending.title',{n:count});
  document.getElementById('pending-items').innerHTML=[...dirtyViews].map(view=>
    `<button class="pending-item" onclick="setView('${view}')">${esc(tt('ui.nav.'+view+'.title'))}${tt('ui.pending.item_suffix',{n:dirtyCounts.get(view)})}</button>`
  ).join('');
  document.getElementById('pending-save-btn').disabled=saving;
}
function refreshSaveBtn(){
  const btn=document.getElementById('save-btn');
  if(saving){btn.disabled=true;return;}
  const view=VIEWS[activeView]||VIEWS.servers;
  btn.classList.toggle('dirty',dirty&&!view.readOnly);
  // 快速接入：readOnly 但有专属主操作——头部按钮即全站「保存」位（CC 页先例）
  if(activeView==='quickstart'){
    btn.textContent=qs.busy?tt('ui.btn.configuring'):tt('ui.btn.save_and_setup');
    btn.disabled=!!qs.busy;
    btn.title='';
    return;
  }
  if(view.readOnly){btn.textContent=tt('ui.btn.refresh');btn.disabled=false;btn.title=tt('ui.btn.refresh_title',{title:tt('ui.nav.'+activeView+'.title')});return;}
  const count=totalDirtyCount(),crossPage=dirtyViews.size>1||(dirty&&!dirtyViews.has(activeView));
  if(activeView==='rules'){
    btn.textContent=dirty?(crossPage?tt('ui.btn.save_all_sync',{n:count}):tt('ui.btn.save_sync',{n:count})):tt('ui.btn.sync_cc');
    btn.disabled=false;
  }else{
    btn.textContent=dirty?(crossPage?tt('ui.btn.save_all',{n:count}):tt('ui.btn.save_n',{n:count})):tt('ui.btn.save');
    btn.disabled=!dirty;
  }
  btn.title='';
}
function updateStatus(){
  const el=document.getElementById('status-left');
  if(dirty){el.textContent=tt('ui.status.dirty',{n:totalDirtyCount(),m:dirtyViews.size});el.classList.add('dirty');}
  else if(lastSavedAt){el.textContent=tt('ui.status.saved_at',{time:lastSavedAt});el.classList.remove('dirty');}
  else{el.textContent=tt('ui.status.ready');el.classList.remove('dirty');}
  const hint=document.getElementById('shortcut-hint');
  hint.textContent=dirty?tt('ui.hint.save_all'):(activeView==='quickstart'?tt('ui.hint.qs'):(VIEWS[activeView]&&VIEWS[activeView].readOnly?tt('ui.hint.refresh'):tt('ui.hint.save')));
  refreshPendingBar();refreshSaveBtn();
}

// ── confirm-delete helper ─────────────────────────────
function cdel(btn,fn){
  if(btn.dataset.cf==='1'){btn.dataset.cf='';fn();return;}
  btn.dataset.cf='1';
  btn._oh=btn.innerHTML;
  if(!btn.classList.contains('btn-icon'))btn.innerHTML=tt('ui.btn.confirm_delete');
  btn.classList.add('btn-confirm');
  setTimeout(()=>{if(btn.dataset.cf==='1'){btn.dataset.cf='';btn.innerHTML=btn._oh;btn.classList.remove('btn-confirm');}},3000);
}

      `<button class="nav-item" data-view="${id}" ${id===activeView?'aria-current="page"':''} onclick="setView('${id}')">

  document.getElementById('nav-container').innerHTML=html;
}

  renderNav();renderView();

let _labelSeq=0;
function associateLabels(){
  document.querySelectorAll('#viewport label').forEach(label=>{
    if(label.htmlFor)return;
    const ctl=label.parentElement.querySelector('input:not([type=checkbox]):not([type=radio]),select');
    if(!ctl||label.contains(ctl))return;  // 包裹式 label 已隐式关联

// 展示 /api/cc-sync-preview 的目标文件、变更 diff、备份策略；resolve(true)
// 才继续写入。默认焦点给「取消」（最小破坏动作），Escape/遮罩点击=取消，
// Tab 在弹窗按钮间循环；关闭后焦点还原到触发元素。
function ccConfirmSync(pv){
  return new Promise(resolve=>{
    const prev=document.activeElement;
    const rows=ccPreviewRows(pv);
    const ruleRows=ccRuleRows(pv);
    const unlisted=ccUnlistedNote(pv);
    const ruleSec=ruleRows.length?`
      <div class="cc-modal-sec">${tt('ui.cc.sync_rules',{n:ruleRows.length})}</div>
      <div class="cc-diff-scroll"><table class="cc-diff-table"><thead><tr><th>${tt('ui.cc.th_prefix')}</th><th>${tt('ui.cc.th_action')}</th><th>${tt('ui.cc.th_from')}</th><th>${tt('ui.cc.th_to')}</th></tr></thead>
        <tbody>${ruleRows.map(r=>`<tr><td class="mono">${esc(r.prefix)}</td><td><span class="cc-badge cc-badge-${esc(r.badge)}">${esc(r.badge)}</span></td><td class="mono">${esc(r.old)}</td><td class="mono">${esc(r.new)}</td></tr>`).join('')}</tbody></table></div>`:'';
    const warnSec=unlisted?`<p class="cc-modal-backup" style="color:var(--warn)">${esc(unlisted)}</p>`:'';
    const ov=document.createElement('div');
    ov.className='cc-modal-overlay';
    ov.innerHTML=`<div class="cc-modal" role="dialog" aria-modal="true" aria-labelledby="cc-modal-title" aria-describedby="cc-modal-target">
      <h3 id="cc-modal-title">${tt('ui.cc.write_title')}</h3>
      <p class="cc-modal-target" id="cc-modal-target">${tt('ui.cc.target_file')} <code class="mono">${esc(pv.target)}</code>${pv.exists?'':tt('ui.cc.not_exist_create')}</p>
      <div class="cc-modal-sec">${tt('ui.cc.write_n',{n:rows.length})}</div>
      <div class="cc-diff-scroll"><table class="cc-diff-table"><thead><tr><th>${tt('ui.cc.th_env')}</th><th>${tt('ui.cc.th_action')}</th><th>${tt('ui.cc.th_old')}</th><th>${tt('ui.cc.th_new')}</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.key)}</td><td><span class="cc-badge cc-badge-${esc(r.badge)}">${esc(r.badge)}</span></td><td class="mono">${esc(r.old)}</td><td class="mono">${esc(r.new)}</td></tr>`).join('')}</tbody></table></div>
      ${ruleSec}${warnSec}
      <p class="cc-modal-backup">${esc(ccBackupNote(pv))}</p>
      <p class="cc-modal-hint">${tt('ui.cc.hint_cc')}</p>
      <div class="cc-modal-actions">
        <button type="button" class="btn" id="cc-modal-cancel">${tt('ui.common.cancel_action')}</button>
        <button type="button" class="btn btn-primary" id="cc-modal-ok">${tt('ui.cc.confirm_write')}</button>
      </div></div>`;
    const done=ok=>{document.removeEventListener('keydown',onKey,true);ov.remove();if(prev&&prev.focus)prev.focus();resolve(ok);};
    const onKey=e=>{
      if(e.key==='Escape'){e.stopPropagation();done(false);}
      else if(e.key==='Tab'){e.preventDefault();const f=[...ov.querySelectorAll('button')];const i=f.indexOf(document.activeElement);f[(i+1)%f.length].focus();}
    };
    document.addEventListener('keydown',onKey,true);
    ov.addEventListener('click',e=>{if(e.target===ov)done(false);});
    ov.querySelector('#cc-modal-cancel').addEventListener('click',()=>done(false));
    ov.querySelector('#cc-modal-ok').addEventListener('click',()=>done(true));
    document.body.appendChild(ov);
    ov.querySelector('#cc-modal-cancel').focus();
  });
}

async function saveAll(forceRulesSync){
  // 薄胶水：读表单 → 接线 deps → 交给 LAYER 1 状态机。保存流的全部逻辑
  // （校验/两阶段写入/失败关闭/取消/baseline 推进/分支 toast）在 saveFlow，
  // node 测试直接钉住；本函数只剩 DOM 接线与重入保护。
  if(saving)return;
  collect(true);recomputeDirty();
  await saveFlow(
    {S,ccRoles,baselineState,baselineRoles},
    {
      fetch:(...a)=>fetch(...a),api:API,token:'',
      confirmSync:ccConfirmSync,toast,gotoFirstError,
      viewTitle:v=>tt('ui.nav.'+v+'.title'),
      commitConfig:st=>{baselineState=st;},
      commitRoles:rl=>{baselineRoles=rl;},
      stampSaved:at=>{lastSavedAt=at;},

      // 执行——浏览器直开无桥接时 no-op；tunnelId 定向转发会话，null=代理）
      reconnectForwards:(tunnelId)=>nativeSend('reconnectProxy',

      now:()=>new Date().toLocaleTimeString(I18N.lang==='en'?'en-US':'zh-CN'),
    },

}
let _toastGen=0;  // #72 R7a：代际守卫——旧 toast 的超时不得提前藏掉新 toast
function toast(msg,err){
  const t=document.getElementById('toast');document.getElementById('toast-msg').textContent=msg;
  t.setAttribute('role',err?'alert':'status');
  t.className='toast is-visible'+(err?' err':'');
  const gen=++_toastGen;
  // Long messages (e.g. sync results with backup paths) need more read time.
  setTimeout(()=>{if(gen===_toastGen)t.classList.remove('is-visible');},(err||msg.length>40)?6000:4000);
}

// 四个 pane 全量常驻渲染、inactive 走 [hidden]——collectServers 按

function setProxyServer(){

  if(activeTunnel===proxyIndexOf(S))return;
  // v2：proxy_server_id 单一真相；未保存的新服务器尚无 id（保存时服务端

function addServer(){collectServers();S.mp.servers.push({id:'',name:'',ssh:{user:'',host:'',port:22,auth_type:'key',ssh_key:'',compression:true},services:{ssh:{forwards:[],autostart:false}}});activeTunnel=S.mp.servers.length-1;recomputeDirty();renderView();}
// 删除时保全代理角色：删的是角色服务器（id 匹配）→ 清空 id 真相，靠下标
// 钳制回落剩余首条；删前方服务器下标前移——角色始终指向同一条服务器
function removeServer(i){if(!S.mp.servers.length)return;collectServers();const removed=S.mp.servers[i];S.mp.servers.splice(i,1);if(removed&&removed.id&&(removed.id===(S.mp.proxy_server_id||'')))S.mp.proxy_server_id='';activeTunnel=Math.max(0,Math.min(i,S.mp.servers.length-1));recomputeDirty();renderView();}

function removeForward(fi){collectServers();const t=S.mp.servers[activeTunnel];const fs=forwardsOf(t);if(!t||!fs.length)return;sshSvc(t).forwards=fs;fs.splice(fi,1);recomputeDirty();renderView();}
function collectServers(){
  // 单一 collect 读整页 detail（连接 + SSH 转发实例 + NFS）——data-tf /
  // data-fwf / data-nf / data-nmf 四族字段同一归宿（合并旧 collectTunnel/
  // collectNfs，scope 含 detail-bar 的名称输入）
  const ts=S.mp.servers;if(!ts.length)return;const t=ts[activeTunnel];if(!t)return;
  const d=document.querySelector('.md-detail');if(!d)return;
  const v=f=>{const el=d.querySelector(`[data-tf="${f}"]`);return el?el.value:'';};
  t.name=v('name').trim();const a=parseAddr(v('addr'));
  sshOf(t).user=a.user;sshOf(t).host=a.host;
  sshOf(t).port=parseInt(v('ssh_port'))||22;sshOf(t).auth_type=v('auth')||'key';sshOf(t).ssh_key=v('key');
  // 空输入恢复 null：密码是掩码字段，清空 = 不改（服务器只在非空时写钥匙串），
  // 残留旧值会让 dirty 卡住并把幽灵密码静默写入。
  const pw=v('pw');t.password=pw||null;
  const cb=d.querySelector('[data-tf="compress"]');sshNode(t).compression=cb&&cb.getAttribute('aria-checked')==='true';
  const fab=d.querySelector('[data-tf="fw_autostart"]');sshSvc(t).autostart=fab&&fab.getAttribute('aria-checked')==='true';
  // 端口转发行按 DOM 顺序读回（行序即数组序）；缺省口径与 viewSnapshot
  // 同一语义：空端口=0、空地址=127.0.0.1
  const fws=[];
  d.querySelectorAll('.fw-table tbody tr[data-fwr]').forEach(tr=>{
    const g=k=>{const el=tr.querySelector(`[data-fwf="${k}"]`);return el?el.value:'';};
    const sw=tr.querySelector('[data-fwf="enabled"]');
    fws.push({local_port:parseInt(g('local_port'),10)||0,
      remote_host:g('remote_host').trim()||'127.0.0.1',
      remote_port:parseInt(g('remote_port'),10)||0,
      enabled:!sw||sw.getAttribute('aria-checked')==='true'});
  });
  sshSvc(t).forwards=fws;
  // NFS 面：缺省口径与 nfsProjection 同一语义（空端口=12049）
  const val=k=>{const el=d.querySelector(`[data-nf="${k}"]`);return el?el.value:'';};
  const sw=k=>{const el=d.querySelector(`[data-nf="${k}"]`);return !!el&&el.getAttribute('aria-checked')==='true';};
  const mounts=[];
  d.querySelectorAll('tr[data-nmr]').forEach(tr=>{
    const g=k=>{const el=tr.querySelector(`[data-nmf="${k}"]`);return el?el.value.trim():'';};
    const auto=tr.querySelector('[data-nmf="auto"]');
    mounts.push({name:g('name'),remote_path:g('remote_path'),
      local_dir:g('local_dir'),auto_mount:!!auto&&auto.getAttribute('aria-checked')==='true'});
  });
  Object.assign(nfsNode(t),{enabled:sw('enabled'),
    local_port:parseInt(val('port'),10)||12049,
    squash_to_ssh_user:sw('squash'),mounts});
  // VPN 面：用户名 + pull_dns 开关（profile/密码经各自端点，不进 JSON）
  const vv=d.querySelector('[data-vf="username"]');
  if(vv)vpnNode(t).username=vv.value.trim();
  const vsw=d.querySelector('[data-vf="pull_dns"]');
  if(vsw)vpnNode(t).pull_dns=vsw.getAttribute('aria-checked')==='true';
}

const VPN_ACTIVE=['connecting','connected','reconnecting'];
const VPN_TAIL_KEYS={connecting:'vpn.tail.connecting',connected:'vpn.tail.connected',reconnecting:'vpn.tail.reconnecting',exiting:'vpn.tail.exiting',error:'vpn.tail.error',stopped:'vpn.tail.stopped'};

  if(hasBridge){nativeSend('pickVpnProfile',{});return;}

// 原生 WKWebView 的投递入口（与浏览器 FileReader 共用同一导入核心）

async function vpnImportContent(btn,content){
  collectServers();
  const ts=S.mp.servers||[],i=activeTunnel;
  if(!(i>=0&&i<ts.length)){toast(tt('ui.vpn.no_server'),true);return;}
  if(!content||!content.trim()){toast(tt('ui.vpn.pick_file'),true);return;}
  const orig=btn?btn.textContent:null;
  if(btn){btn.disabled=true;btn.textContent=tt('ui.vpn.importing');}
  try{
    const r=await fetch('/api/vpn-profile',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({index:i,content})});
    const d=await r.json();
    if(!d.ok){_setProbeResult('vpn-feedback','❌ '+(d.error||tt('ui.vpn.import_failed')),'var(--danger)');return;}
    const v=vpnNode(S.mp.servers[i]);
    v.profile_set=true;
    v.auth=d.needs_credentials?'userpass':'none';
    const notes=[];
    if(d.removed&&d.removed.length)notes.push(tt('ui.vpn.sanitized',{n:d.removed.length})+'：'+d.removed.join(', '));
    if(d.missing_client_role)notes.push(tt('ui.vpn.no_client_role'));
    _setProbeResult('vpn-feedback','✅ '+tt('ui.vpn.imported')+(notes.length?'\n'+notes.join('\n'):''),'var(--ok)');
    recomputeDirty();renderView();
  }catch(e){_setProbeResult('vpn-feedback','❌ '+tt('ui.vpn.import_failed'),'var(--danger)');}
  finally{if(btn){btn.disabled=false;btn.textContent=orig;renderView();}}
}

async function vpnInstall(btn){
  collectServers();
  const ts=S.mp.servers||[],i=activeTunnel;
  if(!(i>=0&&i<ts.length)){toast(tt('ui.vpn.no_server'),true);return;}
  const orig=btn.textContent;btn.disabled=true;btn.textContent=tt('ui.vpn.installing');
  _setProbeResult('vpn-feedback',tt('ui.vpn.installing_hint'),'var(--muted)');
  try{
    const r=await fetch('/api/vpn-install',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({index:i})});
    const d=await r.json();
    if(d.ok)_setProbeResult('vpn-feedback','✅ '+tt('ui.vpn.install_ok'),'var(--ok)');
    else{
      // 错误码分流：缺席二进制（最常见——本机未装）给安装指引，其余如实
      const key=d.error_code==='openvpn_missing'?'vpn.err.no_binary_code'
        :d.error_code==='cancelled'?'ui.vpn.install_cancelled'

        :'ui.vpn.install_failed';
      _setProbeResult('vpn-feedback','❌ '+tt(key),'var(--danger)');
    }
  }catch(e){_setProbeResult('vpn-feedback','❌ '+tt('ui.vpn.install_failed'),'var(--danger)');}
  finally{btn.disabled=false;btn.textContent=orig;}
}

  if(!(i>=0&&i<ts.length)){toast(tt('ui.vpn.no_server'),true);return;}
  const active=VPN_ACTIVE.includes((S.mp.vpn_state&&S.mp.vpn_state.status)||'');
  const orig=btn.textContent;btn.disabled=true;
  const _arm=(on)=>{
    // 确认期（10s）：按钮改「确认切换」并染警示色——互斥确认不可能错过
    btn.dataset.armed=on?'1':'';
    btn.classList.toggle('btn-danger',on);
    btn.textContent=tt(on?'ui.vpn.confirm_btn':'ui.vpn.connect');
  };
  try{
    if(active){
      await fetch('/api/vpn-disconnect',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({})});
    }else{
      const force=Date.now()-_vpnForceArmedAt<10000;
      const r=await fetch('/api/vpn-connect',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({index:i,force})});
      const d=await r.json();
      if(d.error==='ssh_active'&&!force){
        _vpnForceArmedAt=Date.now();
        _arm(true);
        setTimeout(()=>_arm(false),10000);
        _setProbeResult('vpn-feedback',tt('ui.vpn.confirm_switch'),'var(--warning,var(--muted))');
        btn.disabled=false;
        return;
      }
      if(d.error==='ssh_active'&&force){_arm(false);}
      if(d.error==='no_profile'){toast(tt('ui.vpn.profile_none'),true);_setProbeResult('vpn-feedback','❌ '+tt('ui.vpn.profile_none'),'var(--danger)');return;}
      if(!d.ok){toast(tt('ui.vpn.action_failed'),true);_setProbeResult('vpn-feedback','❌ '+tt('ui.vpn.action_failed'),'var(--danger)');return;}
    }
    _arm(false);
    scheduleVpnPoll();
  }catch(e){toast(tt('ui.vpn.action_failed'),true);}
  finally{btn.disabled=false;if(!btn.dataset.armed)btn.textContent=VPN_ACTIVE.includes((S.mp.vpn_state&&S.mp.vpn_state.status)||'')?tt('ui.vpn.disconnect'):orig;}
}
function vpnStatusLine(s){
  if(!s||!s.status||s.status==='idle')return tt('ui.vpn.state_idle');
  const bits=[tt(VPN_TAIL_KEYS[s.status]||'vpn.tail.stopped')];
  if(s.tun_ip)bits.push('tun '+s.tun_ip);
  if(s.error_kind)bits.push(s.error_kind);
  return bits.join(' · ');
}
function scheduleVpnPoll(){
  clearInterval(_vpnPollTimer);
  _vpnPollTimer=setInterval(vpnRefreshState,5000);
  vpnRefreshState();
}
async function vpnRefreshState(){

// 服务卡一键检测（svcCheck）：SSH / OpenVPN 卡共用——后端按「已保存」的
// servers[index] 探测（同一 SAVED-config 语义，未保存的表单编辑不参与）；
// NFS 卡走 nfsCheckRemote（富渲染已就绪，保持不动）。kind→探针区 id 映射
// 补齐历史命名差（openvpn 卡的探针区是 probe-vpn）。
const SVC_PROBE_ID={ssh:'probe-ssh',openvpn:'probe-vpn'};
async function svcCheck(kind,btn){
  collectServers();
  const ts=S.mp.servers||[],i=activeTunnel;
  if(!(i>=0&&i<ts.length)){toast(tt('ui.svc.no_server'),true);return;}
  const pid=SVC_PROBE_ID[kind]||('probe-'+kind);
  const orig=btn.textContent;
  btn.disabled=true;btn.textContent=tt('ui.svc.checking');
  _setProbeResult(pid,tt('ui.svc.checking_saved'),'var(--muted)');
  const restore=()=>{btn.disabled=false;btn.textContent=orig;};
  try{
    const r=await fetch('/api/server-check',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({index:i,only:kind})});
    const d=await r.json();
    const res=d&&d.results&&d.results[kind];
    if(!res)_setProbeResult(pid,'❌ '+(d.error||tt('ui.svc.fail')),'var(--danger)');
    else if(kind==='openvpn'){
      if(!res.ok)_setProbeResult(pid,'❌ '+(res.error||tt('ui.svc.fail')),'var(--danger)');
      else if(res.installed)_setProbeResult(pid,'✅ '+tt('ui.svc.installed')+' · '+(res.version||''),'var(--ok)');
      else _setProbeResult(pid,'❌ '+tt('ui.svc.not_installed'),'var(--muted)');
    }else{
      if(res.ok)_setProbeResult(pid,'✅ '+tt('ui.svc.ssh_ok')+(res.latency_ms!=null?' · '+res.latency_ms+'ms':''),'var(--ok)');
      else _setProbeResult(pid,'❌ '+(res.error||tt('ui.svc.fail')),'var(--danger)');
    }
    restore();
  }catch(e){_setProbeResult(pid,'❌ '+tt('ui.svc.request_fail',{msg:e.message}),'var(--danger)');restore();}

const NFS_POLL_MS=5000;

function nfsPollLoop(){
  nfsStopPoll();

    if(activeView!=='servers')return;

function nfsUpdateStatusCells(){

function validatePort(el){
  const v=parseInt(el.value);
  const ok=!isNaN(v)&&v>=1&&v<=65535;
  el.classList.toggle('invalid',!ok);
  el.setAttribute('aria-invalid',String(!ok));
  const field=el.closest('.field');let msg=field?field.querySelector('.field-error'):null;
  if(ok){if(msg)msg.remove();el.removeAttribute('aria-describedby');return true;}
  if(!msg&&field){
    msg=document.createElement('div');msg.className='field-error';
    msg.id='ferr-'+(++_labelSeq);field.appendChild(msg);
  }
  if(msg){msg.textContent=tt('ui.net.port_range');el.setAttribute('aria-describedby',msg.id);}
  return false;
}
// 保存失败定位：按错误文案前缀映射页面，跳转后聚焦第一个无效端口（#3——
// 错误不再只靠 Toast，跨隐藏页面的错误也能一键到达）。
const ERROR_VIEW_MAP=[[/^服务器|^Server /,'servers'],[/^(SOCKS5|HTTP|抓包|配置服务|路由网关|端口冲突)|^Invalid |^Port conflict/,'proxy'],[/^供应商|^Provider |^Rule |^Default route/,'providers']];
function gotoFirstError(firstError){
  const hit=ERROR_VIEW_MAP.find(([re])=>re.test(firstError));
  if(!hit)return;
  if(activeView!==hit[1])setView(hit[1]);
  setTimeout(()=>{
    document.querySelectorAll('#viewport input[type=number]').forEach(validatePort);
    const bad=document.querySelector('#viewport input.invalid');
    if(bad){bad.focus();bad.scrollIntoView({block:'center',behavior:'smooth'});}
  },30);
}

function collectProvider(){
  const d=document.querySelector('.md-detail .detail-body');if(!d||!activeProvider)return;
  const p=S.sp.providers[activeProvider];if(!p)return;
  const v=f=>{const el=d.querySelector(`[data-pf="${f}"]`);return el?el.value:'';};
  const newName=v('name').trim()||activeProvider;
  p.base_url=v('base_url').trim();
  // api_key_set 是服务器掩码真相（suanpan/config.py _restore_key 的 keep 入参），
  // JS 只回传、永不改写；清空输入 = api_key 恢复 null（保留已存 key）。
  const keyVal=v('api_key');p.api_key=keyVal||null;
  p.api_key_env=v('api_key_env').trim()||null;
  p.auth_header=v('auth_header')||null;
  const sw=d.querySelector('[data-pf="enabled"]');p.enabled=sw&&sw.getAttribute('aria-checked')==='true';
  const swAN=d.querySelector('[data-pf="anthropic_native"]');p.anthropic_native=swAN&&swAN.getAttribute('aria-checked')==='true';
  if(newName!==activeProvider){
    if(S.sp.providers[newName]){toast(tt('ui.providers.name_taken',{name:newName}),true);return;}
    const oldName=activeProvider;
    const np={};for(const[k2,v2]of Object.entries(S.sp.providers))np[k2===activeProvider?newName:k2]=v2;S.sp.providers=np;activeProvider=newName;
    // Update rule references
    const prefix=oldName+'/';
    (S.sp.rules||[]).forEach(r=>{if(r.route_to&&r.route_to.startsWith(prefix))r.route_to=newName+'/'+r.route_to.substring(prefix.length);});
    if(S.sp.router&&S.sp.router.default&&S.sp.router.default.startsWith(prefix))S.sp.router.default=newName+'/'+S.sp.router.default.substring(prefix.length);
    // #72 R7a：ccRoles 的 model 引用同步改写——悬空后经 fall-through
    // 静默误投（路由侧只认 provider 名）
    Object.values(ccRoles||{}).forEach(r=>{
      if(r&&r.model&&r.model.startsWith(prefix))r.model=newName+'/'+r.model.substring(prefix.length);
    });
  }
}
async function fetchProviderModels(btn){
  collectProvider();

  btn.disabled=true;btn.textContent=tt('ui.providers.fetching');
  const restore=()=>{btn.disabled=false;btn.textContent=tt('ui.providers.fetch');};
  try{
    const r=await fetch('/api/fetch-models',{method:'POST',headers:apiHeaders(null,{'Content-Type':'application/json'}),body:JSON.stringify({provider:name})});
    const d=await r.json();
    if(d.error){if(errEl)errEl.textContent=d.error;restore();}
    else{
      // Union-merge: hand-added models survive a fetch; new API entries append.
      const cur=S.sp.providers[name].models||[];
      (d.models||[]).forEach(m=>{if(!cur.includes(m))cur.push(m);});
      S.sp.providers[name].models=cur;recomputeDirty();renderView();
    }
  }catch(e){if(errEl)errEl.textContent=tt('ui.svc.request_fail',{msg:e});restore();}
}

function dailyBarsSVG(daily,metric){
  const bars=dailyBarData(daily,metric);
  if(bars.length<2)return'';
  const def=DAILY_METRICS[metric]||DAILY_METRICS.input;
  const SLOT=12,BAR=7,H=48,W=bars.length*SLOT;
  const rects=bars.map((b,i)=>{
    if(!b.ratio)return'';  // 无消耗的日子留空位（间隔即日历）
    const h=Math.max(2,b.ratio*(H-2));
    return `<rect x="${(i*SLOT+(SLOT-BAR)/2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${BAR}" height="${h.toFixed(1)}" rx="1.5"><title>${esc(b.title)}</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${tt('ui.usage.trend_aria',{metric:tt('ui.usage.metric.'+metric)})}" style="max-width:${W}px">${rects}</svg>`;
}

// ── Claude Code sync ──────────────────────────────────
// In-memory role state: {key: {model, name, ctx_1m}}.  The role list
// (order/labels/readonly) comes from /api/cc-default-roles — Python's
// _ROLES is the single source of truth (#44); the UI has no parallel list.
let ccRoles={};
let ccRoleMeta={};
// 用户已点「按路由规则重置」——横幅文案切到保存提示；重新加载种子时复位。
let ccDriftAck=false;

async function ccInitRoles(){
  try{
    const r=await fetch('/api/cc-default-roles',{headers:apiHeaders(null)});
    const d=(await r.json())||{};
    // 边界加固：角色 key 会进 onclick 单引号串、label 进 innerHTML——
    // 当前来源是 Python 常量，但按不可信载荷处理，白名单过滤一劳永逸。
    d.order=(d.order||[]).filter(k=>/^[\w-]+$/.test(k));
    ccRoles=d.roles||{};
    ccRoleMeta=d;
  }catch(e){ccRoles={};ccRoleMeta={};}
  ccDriftAck=false;
  baselineRoles=cloneData(ccRoles);
  ccRenderRoles();ccRenderDefault();ccRenderDrift();recomputeDirty();
}

// 漂移横幅：synced+drift 时展示（ccDriftInfo 纯函数定文案/按钮）。
// DOM 每次进 rules 视图重建，所以 renderView 与 ccInitRoles 都要重画。
function ccRenderDrift(){
  const el=document.getElementById('cc-drift-banner');
  if(!el)return;
  const info=ccDriftInfo(ccRoleMeta,{acked:ccDriftAck});
  el.hidden=!info.show;
  if(!info.show)return;
  const text=document.getElementById('cc-drift-text');
  if(text)text.textContent='⚠️ '+info.text;
  // 按钮按需注入（重置后消失）；id 钉住避免重复 append
  let btn=document.getElementById('cc-drift-reset');
  if(info.reset&&!btn){
    btn=document.createElement('button');
    btn.className='btn btn-sm';btn.id='cc-drift-reset';
    btn.textContent=tt('ui.cc.reset_by_rules');btn.onclick=ccResetSeed;
    el.appendChild(btn);
  }else if(!info.reset&&btn){btn.remove();}
}

async function ccResetSeed(){
  try{
    const r=await fetch('/api/cc-default-roles?seed=rules',{headers:apiHeaders(null)});
    const d=(await r.json())||{};
    d.order=(d.order||[]).filter(k=>/^[\w-]+$/.test(k));
    ccRoles=d.roles||{};ccRoleMeta=d;
  }catch(e){return;}
  ccDriftAck=true;
  ccRenderRoles();ccRenderDefault();ccRenderDrift();recomputeDirty();
}

  const role=ccRoleEntry(ccRoles,key);
  // A display name follows the model unless the user customised it.
  if(!role.name||role.name===role.model)role.name=val;
  role.model=val;
  const nameInput=document.querySelector(`[data-cc-name="${key}"]`);
  if(nameInput)nameInput.value=ccRoles[key].name;
}

function ccRoleName(key,val){
  ccRoleEntry(ccRoles,key).name=val;
}

function ccRole1m(key,checked){

}

function collectRules(){
  // The fallback belongs to both the gateway config and Claude Code's

  const sel=document.getElementById('cc-default-model');

// ── AI agent helper ───────────────────────────────────
function copyAgentInstructions(){
  // #70 S13：token 拼装移原生侧（#10 后 URL 永不带凭证，此处曾恒空
  // 导致复制的 curl 401）。WKWebView 走 bridge：app 持 expected_token
  // 把完整文本上剪贴板，toast 由原生通知承担。浏览器直开设置页无桥接，
  // 曾是静默空操作（对齐 reconnectProxy 的降级约定）——回退经认证
  // /api/agent-instructions 取同一文案自行写剪贴板。
  if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.bridge){
    nativeSend('copyAgentInstructions');
    return;
  }
  copyAgentInstructionsViaApi();
}
async function copyAgentInstructionsViaApi(){
  try{
    const r=await fetch('/api/agent-instructions');
    if(!r.ok)throw new Error('HTTP '+r.status);
    const d=await r.json();
    if(!d.text)throw new Error(tt('ui.agent.no_text'));
    if(!(await _writeClipboard(d.text)))throw new Error(tt('ui.agent.clip_denied'));
    toast(tt('ui.agent.copied'));
  }catch(e){
    toast(tt('ui.agent.copy_fail',{msg:(e&&e.message||e)}),true);
  }
}
async function _writeClipboard(text){
  // 127.0.0.1 属安全上下文，优先异步 Clipboard API；Safari 等场景下
  // 用户手势可能不跨 await 存活，退 execCommand 同步复制兜底。
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();
  return ok;
}

// ══ 快速接入向导（ADR-010 M5）═════════════════════════════════════
// 「一个 Key 进，所有 Agent 通」：厂商模板 + Key → 三级端点探测 →
// Agent 矩阵（推荐协议）→ 确认 diff → 写入。供应商创建走与设置页同一条
// PUT /api/state 管线（复用 validateConfig 首层校验）；Agent 写入走
// agent-setup-preview / setup-agent（Claude Code 复用既有 cc 端点）。
// 视图 readOnly（不进 EDITABLE_VIEWS），所有动作显式即时生效；
// 样式全部走 .qs-* 组件类与页面既有控件形态（rules-table/field/btn），
// 表格内不内嵌表单控件——行高一致由「协议列纯文字 + 选项区在③」保证。
let qs={templateId:'',name:'',key:'',probe:null,agents:null,sel:{},results:[],busy:false};
function qsTemplate(){return PROVIDER_TEMPLATES.find(t=>t.id===qs.templateId)||null;}
// 模板 → 主端点选择：优先 anthropic 卡（保 cache_control），无则 openai 卡
function qsPickEndpoint(t){
  const ep=(t&&t.endpoints)||{};
  if(ep.anthropic&&ep.anthropic.base_url)return{protocol:'anthropic',base_url:ep.anthropic.base_url,
    anthropic_native:ep.anthropic.anthropic_native===true,auth_header:ep.anthropic.auth_header||null};
  if(ep.openai&&ep.openai.base_url)return{protocol:'openai',base_url:ep.openai.base_url,
    anthropic_native:false,auth_header:null};
  return null;
}
function qsTemplates(){
  return PROVIDER_TEMPLATES.filter(t=>t.endpoints&&Object.keys(t.endpoints).length);
}
function qsPick(id){
  qs.templateId=id;qs.name=id;qs.probe=null;qs.results=[];
  if(activeView==='quickstart')renderView();
}
// 所选厂商的模型清单（P0 修复：不再回退到默认路由供应商——那会把别家
// 厂商的模型灌进 Codex 下拉）。探测结果 > 同名已保存供应商 > 空。
function qsVendorModels(){
  if(qs.probe){
    const p=qs.probe;
    const list=(p.anthropic&&p.anthropic.models)||(p.openai&&p.openai.models)||[];
    if(list.length)return list;
  }
  const existing=(((S.sp||{}).providers)||{})[qs.name];
  return(existing&&existing.models)||[];
}
// 所选厂商是否可服务 Codex：模板有 responses 端点卡，或同名已保存供应
// 商已配 responses_base_url（P0 修复：失败前置到矩阵行，而非应用时才报）
function qsVendorHasResponses(){
  const t=qsTemplate();
  const viaTpl=!!(t&&t.endpoints&&t.endpoints.responses&&t.endpoints.responses.base_url);
  const existing=(((S.sp||{}).providers)||{})[qs.name];
  return viaTpl||!!(existing&&existing.responses_base_url);
}
function qsSet(field,v){qs[field]=v;}
function qsToggle(id,on){qs.sel[id]=on;if(activeView==='quickstart')renderView();}

function qsAgentRow(a){
  const checked=qs.sel[a.id]!==undefined?qs.sel[a.id]:(a.installed&&!a.synced);
  let sub='',proto='',dis=false;
  if(a.id==='codex'){
    proto='Responses';
    if(!qsVendorHasResponses()){
      dis=true;sub=tt('ui.qs.no_responses');
      proto='<span class="qs-state-muted">'+tt('ui.qs.responses_na')+'</span>';
    }
  }else if(a.id==='opencode')proto=tt('ui.qs.opencodes_proto');
  else if(a.id==='claude-code')proto=tt('ui.qs.cc_proto');
  else proto='Anthropic';
  if(!a.installed&&!sub)sub=tt('ui.qs.not_installed');
  if(a.id==='claude-code'&&a.synced&&!sub)sub=tt('ui.qs.already_synced');
  const state=a.synced
    ?'<span class="qs-state-ok">✓ '+tt('ui.qs.synced')+'</span>'
    :(a.installed?'<span class="qs-state-default">'+tt('ui.svc.installed')+'</span>':'<span class="qs-state-muted">'+tt('ui.qs.missing')+'</span>');
  const box=a.installed&&!dis
    ?`<input type="checkbox" ${checked?'checked':''} onchange="qsToggle('${esc(a.id)}',this.checked)" style="width:16px;height:16px;accent-color:var(--accent)" aria-label="${tt('ui.qs.configure',{name:esc(a.label)})}">`
    :`<input type="checkbox" disabled style="width:16px;height:16px;accent-color:var(--accent)" aria-label="${esc(a.label)}${tt('ui.qs.unavailable_paren')}">`;
  return `<tr${dis?' class="qs-disabled"':''}${a.installed&&!dis?` onclick="qsRowClick(event,'${esc(a.id)}',${!checked})"`:''}>
    <td style="text-align:center;width:40px">${box}</td>
    <td><span class="qs-agent-main">${esc(a.label)}</span>${sub?`<span class="qs-agent-sub">${esc(sub)}</span>`:''}</td>
    <td>${state}</td>
    <td><span class="qs-state-default">${proto}</span></td></tr>`;
}

async function qsLoadAgents(){

  }catch(e){qs.agents=[];}
